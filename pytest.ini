[pytest]
# Make "from Engine..." and "from api..." work when pytest runs from the repo root.
pythonpath = .
# Only these two files are collected. The older files in tests/ (test_*_scenario.py) are demo
# scripts with no assert statements: run them by hand, they cannot fail a build.
python_files = test_api_and_engine.py test_engine_scenarios.py test_key_type_mismatch_detector.py test_lost_rows_detector.py test_null_join_keys_detector.py test_explainer_ollama.py
testpaths = tests
